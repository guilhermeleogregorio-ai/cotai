<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comprador IA</title>
<style>
:root{--bg:#0b1020;--p:#141b33;--b:#26315a;--t:#e8ecff;--m:#8a95c4;--a:#0a9bff;--w:#ffb020;--ok:#2ecc8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 Barlow,system-ui,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:16px 24px;border-bottom:1px solid var(--b)}
h1{font-size:20px;margin:0;flex:1}.stat{color:var(--m)}.stat b{color:var(--ok)}
form{display:flex;gap:8px;padding:16px 24px}textarea{flex:1;background:var(--p);border:1px solid var(--b);color:var(--t);border-radius:6px;padding:10px;font:inherit}
button{background:var(--a);color:#001;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}button.g{background:var(--p);color:var(--t);border:1px solid var(--b)}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 24px 24px}@media(max-width:800px){.cols{grid-template-columns:1fr}}
.col{background:var(--p);border:1px solid var(--b);border-radius:8px;min-height:300px;padding:10px}.col h3{margin:0 0 10px;font-size:14px;color:var(--m)}
.card{background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:10px;margin-bottom:8px;cursor:pointer}.card:hover{border-color:var(--a)}.card small{color:var(--m);display:block}
dialog{background:var(--p);color:var(--t);border:1px solid var(--b);border-radius:10px;width:min(900px,95vw);max-height:90vh}dialog::backdrop{background:#000a}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}th,td{border-bottom:1px solid var(--b);padding:6px;text-align:left}tr.best td{color:var(--ok)}tr.bad td{opacity:.5}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:6px;border-left:3px solid var(--a)}a{color:var(--a)}.est{color:var(--w)}
textarea.s{width:100%;height:50px;margin-top:4px}
</style></head><body>
<header><h1>Comprador IA</h1><span class="stat" id="st"></span></header>
<form id="f"><textarea id="t" rows="2" placeholder="Ex: preciso de 800m de cabo flexivel 2,5mm pra entregar em Ribeirão Preto ate dia 20"></textarea><button>Cotar</button></form>
<div class="cols" id="cols"></div><dialog id="d"></dialog>
<script>
const S=["solicitado","cotando","comparando","decidido"],N={solicitado:"Solicitado",cotando:"Cotando",comparando:"Comparando",decidido:"Decidido"};
const $=s=>document.querySelector(s),brl=v=>v==null?"—":"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2});
const api=(u,m="GET",b)=>fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:b&&JSON.stringify(b)}).then(r=>r.json());
let data=[],open=null;
$("#f").onsubmit=async e=>{e.preventDefault();if(!$("#t").value.trim())return;await api("/api/requests","POST",{text:$("#t").value});$("#t").value="";load()};
async function load(){data=await api("/api/requests");const s=await api("/api/stats");
 $("#st").innerHTML=`${s.decididas} decididas · economia <b>${brl(s.economia_total)}</b>`;
 $("#cols").innerHTML=S.map(c=>`<div class="col"><h3>${N[c]} (${data.filter(r=>r.status==c).length})</h3>${data.filter(r=>r.status==c).map(r=>`<div class="card" onclick="show(${r.id})"><b>${r.item?`${r.item.produto} · ${r.item.quantidade}${r.item.unidade||""}`:r.raw.slice(0,50)}</b><small>${r.quotes.filter(q=>q.status.startsWith("respondida")).length}/${r.quotes.length} cotações</small><small>${r.log.at(-1)||"na fila"}</small></div>`).join("")}</div>`).join("");
 if(open&&$("#d").open)render(open)}
function show(id){open=id;render(id);$("#d").showModal()}
function render(id){const r=data.find(x=>x.id==id);if(!r)return;
 const rk=r.ranking||[];
 $("#d").innerHTML=`<button class="g" onclick="$('#d').close();open=null" style="float:right">Fechar</button><h2>${r.item?.produto||"Interpretando…"}</h2><small>${r.raw}</small>
 <h3>Cotações</h3><table><tr><th>Fornecedor</th><th>Unit.</th><th>Frete</th><th>Prazo</th><th>Total</th><th>Status</th><th></th></tr>
 ${r.quotes.map(q=>{const k=rk.find(x=>x.id==q.id),i=rk.indexOf(k);return`<tr class="${i==0?"best":k&&!k.viavel?"bad":""}"><td><a href="${q.url}" target=_blank>${q.supplier}</a></td><td>${brl(q.unit_price)}</td><td>${brl(q.freight)}${q.freight_estimated?'<span class="est"> est.</span>':""}</td><td>${q.lead_days??"—"}d</td><td>${k?brl(k.total):"—"}</td><td>${q.status}</td>
 <td>${r.status=="comparando"&&k?.viavel?`<button onclick="dec(${r.id},${q.id})">Decidir</button>`:""}</td></tr>
 ${q.invite?`<tr><td colspan=7>Convidar: ${q.invite.telegram?`<a href="${q.invite.telegram}" target=_blank>link Telegram</a>`:""} ${q.invite.whatsapp?` · <a href="${q.invite.whatsapp}" target=_blank>WhatsApp</a>`:""} ${q.invite.can_confirm?` · <button class="g" style="padding:2px 8px;font-size:12px" onclick="cfm(${q.id})">Confirmar envio Bot</button>`:""}</td></tr>`:""}
 ${["enviada","aguardando_contato","respondida_parcial"].includes(q.status)?`<tr><td colspan=7><textarea class="s" id="rp${q.id}" placeholder="Colar resposta do fornecedor recebida por outro canal"></textarea><button class="g" onclick="rep(${q.id})">Enviar resposta</button></td></tr>`:""}`}).join("")}</table>
 ${r.reasoning?`<h3>Por quê</h3><pre>${r.reasoning}</pre>`:""}
 ${r.status=="decidido"?`<p>Decidido · economia <b>${brl(r.savings)}</b></p>`:`<button class="g" onclick="cmp(${r.id})">Comparar agora</button> ${rk.length>1&&r.status=="comparando"?`<button class="g" onclick="neg(${r.id})">Negociar</button>`:""}`}
 <h3>Log dos agentes</h3><pre>${r.log.join("\n")}</pre>`}
const dec=async(r,q)=>{await api(`/api/requests/${r}/decide`,"POST",{quote_id:q});load()},cmp=async r=>{await api(`/api/requests/${r}/compare`,"POST");load()},
 neg=async r=>{const x=await api(`/api/requests/${r}/negotiate`,"POST");alert(x.enviadas+" fornecedores contatados")},rep=async q=>{await api(`/api/quotes/${q}/reply`,"POST",{text:$("#rp"+q).value});load()},cfm=async q=>{await api(`/api/quotes/${q}/confirm`,"POST");load()};
load();setInterval(load,3000);
</script></body></html>
